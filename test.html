<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Nepal RAG</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 0 auto; padding: 2rem; }
        textarea { width: 100%; height: 80px; font-size: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; }
        #output { white-space: pre-wrap; background: #f0f0f0; padding: 1rem; border-radius: 8px; margin-top: 1rem; min-height: 100px; }
    </style>
</head>
<body>
    <h1>Nepal RAG Test</h1>
    <textarea id="q">नागरिकता कार्ड कसरी लिन सकिन्छ?</textarea><br><br>
    <button onclick="ask()">Ask</button>
    <div id="output"></div>

    <script>
        async function ask() {
            const q = document.getElementById('q').value;
            const out = document.getElementById('output');
            out.textContent = 'Loading...';
            try {
                const res = await fetch('http://127.0.0.1:8000/api/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q}),
                });
                if (!res.ok) {
                    out.textContent = 'Error: HTTP ' + res.status;
                    return;
                }
                const data = await res.json();
                out.textContent = data.answer;
            } catch(e) {
                out.textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
